<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#e8d5c4"/>
  
  <!-- Desk shadow -->
  <ellipse cx="400" cy="520" rx="260" ry="40" fill="#000" opacity="0.08"/>
  
  <!-- Handheld body -->
  <rect x="240" y="120" width="320" height="380" rx="32" fill="#2d1b2e"/>
  <rect x="250" y="130" width="300" height="360" rx="24" fill="#3d253e"/>
  
  <!-- Screen -->
  <rect x="290" y="170" width="220" height="180" rx="8" fill="#1a1a1a"/>
  
  <!-- Cartridge icons -->
  <rect x="310" y="200" width="50" height="70" rx="4" fill="#f4d06f"/>
  <rect x="315" y="210" width="40" height="8" rx="2" fill="#2d1b2e"/>
  <rect x="315" y="225" width="40" height="4" rx="1" fill="#2d1b2e"/>
  <rect x="315" y="235" width="40" height="4" rx="1" fill="#2d1b2e"/>
  
  <rect x="375" y="200" width="50" height="70" rx="4" fill="#7fd8be"/>
  <rect x="380" y="210" width="40" height="8" rx="2" fill="#2d1b2e"/>
  <rect x="380" y="225" width="40" height="4" rx="1" fill="#2d1b2e"/>
  
  <rect x="440" y="200" width="50" height="70" rx="4" fill="#ff6b6b"/>
  <rect x="445" y="210" width="40" height="8" rx="2" fill="#2d1b2e"/>
  <rect x="445" y="225" width="40" height="4" rx="1" fill="#2d1b2e"/>
  
  <!-- Labels under icons -->
  <text x="335" y="290" text-anchor="middle" font-family="monospace" font-size="10" fill="#f4d06f">KITCHEN</text>
  <text x="400" y="290" text-anchor="middle" font-family="monospace" font-size="10" fill="#7fd8be">CONTROL</text>
  <text x="465" y="290" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff6b6b">ARCADE</text>
  
  <!-- Title on device -->
  <text x="400" y="150" text-anchor="middle" font-family="monospace" font-size="14" fill="#f5f1e8">SAM COTRONEO</text>
  
  <!-- Buttons -->
  <circle cx="330" cy="420" r="22" fill="#1a1a1a"/>
  <circle cx="330" cy="420" r="18" fill="#2d1b2e"/>
  <circle cx="470" cy="420" r="18" fill="#1a1a1a"/>
  <circle cx="505" cy="405" r="12" fill="#ff6b6b"/>
  <circle cx="505" cy="435" r="12" fill="#7fd8be"/>
  
  <!-- D-pad -->
  <path d="M315,380 h30 v10 h-30 z M325,370 h10 v30 h-10 z" fill="#1a1a1a"/>
</svg>
